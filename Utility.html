<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Utility Landscape Visualizer</title>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --bg-color: #f8f9fa;
            --panel-bg: #ffffff;
            --border-color: #e9ecef;
            --text-main: #333333;
            --text-muted: #6c757d;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.05);
            overflow-y: auto;
            z-index: 10;
        }
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            padding: 15px 25px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            color: var(--primary-color);
        }
        .header p {
            margin: 5px 0 0 0;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        #plot_div {
            flex-grow: 1;
            width: 100%;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .control-header label {
            font-size: 0.9rem;
            font-weight: 600;
        }
        .val-display {
            font-size: 0.85rem;
            color: var(--primary-color);
            background: #eef2f5;
            padding: 2px 8px;
            border-radius: 12px;
            font-family: monospace;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
        }
        .section-title {
            font-size: 1rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-top: 30px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2 style="font-size: 1.1rem; margin-top: 0;">环境参数设置</h2>
        <p style="font-size: 0.8rem; color: #666; margin-bottom: 20px;">
            请调节下方参数，右侧三维图将实时渲染基于 <strong>决策变量 (y, u)</strong> 的效用曲面。
        </p>

        <div class="section-title">车辆库存状态</div>
        
        <div class="control-group">
            <div class="control-header">
                <label>亏电车 (n_low)</label>
                <span class="val-display" id="val_n_low">2</span>
            </div>
            <input type="range" id="n_low" min="0" max="20" step="1" value="2">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label>即将亏电 (n_soon)</label>
                <span class="val-display" id="val_n_soon">3</span>
            </div>
            <input type="range" id="n_soon" min="0" max="20" step="1" value="3">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label>满电车 (n_normal)</label>
                <span class="val-display" id="val_n_normal">2</span>
            </div>
            <input type="range" id="n_normal" min="0" max="20" step="1" value="2">
        </div>

        <div class="section-title">流出与流入率</div>

        <div class="control-group">
            <div class="control-header">
                <label>借车到达率 (λ)</label>
                <span class="val-display" id="val_lam">10.0</span>
            </div>
            <input type="range" id="lam" min="0" max="40" step="2" value="10">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label>还车到达率 (μ)</label>
                <span class="val-display" id="val_mu">12.0</span>
            </div>
            <input type="range" id="mu" min="0" max="40" step="2" value="12">
        </div>
        
        <div class="section-title" style="margin-top:40px; border:none; font-size: 0.8rem; text-align: center;">
            规划总时长 (T) 默认固定为 1.0 
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Decision Variable Utility Explorer</h1>
            <p>X轴: 计划换电量 (y) | Y轴: 调度到达时间 (u) | Z轴: 效用 (Utility)</p>
        </div>
        <div id="plot_div"></div>
    </div>

    <script>
        // ----------------------------------------------------
        // 1. 核心数学模型：JS 版 Utility 函数转换
        // ----------------------------------------------------
        function calculateUtility(lam, mu, u, y, n_low, n_soon, n_normal, T = 1.0) {
            // Factor 1: instant-jump
            let delta_B = Math.min(y, n_low) * 0.8 + Math.min(n_soon, Math.max(0, y - n_low)) * 0.5;

            // Factor 2: conversion-rate (W)
            let N_u = n_soon + n_normal + Math.min(n_low, y) + (mu - lam) * u;
            let N_T = n_soon + n_normal + Math.min(n_low, y) + (mu - lam) * T;
            
            // Clip
            N_u = Math.max(N_u, 1e-6);
            N_T = Math.max(N_T, 1e-6);

            let W = 0;
            if (Math.abs(mu - lam) > 1e-5) {
                let exponent = lam / (mu - lam);
                let ratio = Math.max(N_u / N_T, 1e-6);
                W = 1.0 - Math.pow(ratio, exponent);
            } else {
                W = 1.0 - Math.exp(- (lam / N_u) * (T - u));
            }
            W = Math.max(0, Math.min(W, 1.0)); // Clip [0, 1]

            // Factor 3: stock-out-risk (R)
            let N_serv = Math.max(0, n_soon + n_normal - lam * u + mu * u);
            let expected_demand = lam * (T - u);

            let R = 0;
            if (expected_demand > 1e-6) {
                R = Math.max(0, (expected_demand - N_serv) / expected_demand);
            }
            R = Math.max(0, Math.min(R, 1.0)); // Clip [0, 1]

            return delta_B * W * R;
        }

        // ----------------------------------------------------
        // 2. 网格数据生成器
        // ----------------------------------------------------
        function generatePlotData(lam, mu, n_low, n_soon, n_normal) {
            let y_vals = []; // X axis in plot
            let u_vals = []; // Y axis in plot
            let z_vals = []; // Z axis (Utility)

            // 精度设置：换电量 y 从 0 到 15，步长 0.5
            for (let y = 0; y <= 15; y += 0.5) {
                y_vals.push(y);
            }
            // 精度设置：到达时间 u 从 0.01 到 0.99，步长 0.02
            for (let u = 0.01; u < 1.0; u += 0.02) {
                u_vals.push(u);
            }

            // 计算 Z 矩阵 (外层循环 Y 轴, 内层循环 X 轴是 Plotly surface 的格式要求)
            for (let i = 0; i < u_vals.length; i++) {
                let z_row = [];
                for (let j = 0; j < y_vals.length; j++) {
                    let z = calculateUtility(lam, mu, u_vals[i], y_vals[j], n_low, n_soon, n_normal);
                    z_row.push(z);
                }
                z_vals.push(z_row);
            }

            return { x: y_vals, y: u_vals, z: z_vals };
        }

        // ----------------------------------------------------
        // 3. 页面交互与 Plotly 渲染逻辑
        // ----------------------------------------------------
        const domElements = {
            n_low: document.getElementById('n_low'),
            n_soon: document.getElementById('n_soon'),
            n_normal: document.getElementById('n_normal'),
            lam: document.getElementById('lam'),
            mu: document.getElementById('mu')
        };

        function getParams() {
            return {
                n_low: parseFloat(domElements.n_low.value),
                n_soon: parseFloat(domElements.n_soon.value),
                n_normal: parseFloat(domElements.n_normal.value),
                lam: parseFloat(domElements.lam.value),
                mu: parseFloat(domElements.mu.value)
            };
        }

        function updatePlot() {
            const params = getParams();
            const data = generatePlotData(params.lam, params.mu, params.n_low, params.n_soon, params.n_normal);

            const trace = {
                x: data.x,
                y: data.y,
                z: data.z,
                type: 'surface',
                colorscale: 'Viridis',
                colorbar: {
                    title: 'Utility',
                    thickness: 15,
                    len: 0.7
                }
            };

            const layout = {
                autosize: true,
                margin: { l: 0, r: 0, b: 0, t: 30 },
                scene: {
                    xaxis: { title: '换电量 (y)' },
                    yaxis: { title: '到达时间 (u)' },
                    zaxis: { title: 'Utility' },
                    camera: {
                        eye: {x: 1.5, y: -1.5, z: 1.2} // 初始化一个利于观察的倾斜视角
                    }
                }
            };

            // 使用 react 以最高性能进行重绘
            Plotly.react('plot_div', [trace], layout);
        }

        // 绑定事件监听器：当滑块变动时，更新数值显示并重绘
        Object.keys(domElements).forEach(key => {
            domElements[key].addEventListener('input', function(e) {
                // 更新侧边栏数值显示 (保留1位小数使其整齐)
                document.getElementById(`val_${key}`).innerText = parseFloat(e.target.value).toFixed(1);
                // 实时重绘
                updatePlot();
            });
        });

        // 初始化首次绘制
        updatePlot();
        
        // 窗口缩放时自动适应
        window.addEventListener('resize', () => {
            Plotly.Plots.resize('plot_div');
        });
    </script>
</body>
</html>
